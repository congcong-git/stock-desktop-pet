name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            script: dist:win
          - os: macos-latest
            target: mac
            script: dist:mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        # 注意：package-lock.json 是 npm 6 在 Windows 上生成的 v1 格式，
        # 未记录 darwin 专属可选依赖（dmg-license 等），npm ci 会照 lock 漏装。
        # 用 npm install 让各平台现场解析自己的依赖树。
        run: npm install --no-audit --no-fund

      - name: Force CJS cli-truncate (dmg-license ERR_REQUIRE_ESM workaround)
        if: runner.os == 'macOS'
        run: |
          set -e
          echo "== before =="
          npm ls cli-truncate --all 2>&1 | head -20 || true
          find node_modules -type d -name cli-truncate
          # 删除所有嵌套副本，确保 require 只会命中顶层的 CJS 版本
          find node_modules -mindepth 2 -type d -name cli-truncate -prune -exec rm -rf {} + 2>/dev/null || true
          # 直接取 tarball 解包，绕开 npm 对 lock/overrides 的解析
          rm -rf node_modules/cli-truncate
          npm pack cli-truncate@2.1.0 --pack-destination "$RUNNER_TEMP" >/dev/null
          mkdir -p "$RUNNER_TEMP/ct"
          tar -xzf "$RUNNER_TEMP/cli-truncate-2.1.0.tgz" -C "$RUNNER_TEMP/ct"
          mv "$RUNNER_TEMP/ct/package" node_modules/cli-truncate
          echo "== after =="
          find node_modules -type d -name cli-truncate
          node -p "const p=require('./node_modules/cli-truncate/package.json'); 'cli-truncate '+p.version+' type='+(p.type||'commonjs')"

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 无 Apple 证书，跳过签名发现（已配置证书可删除该变量）
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
          generate_release_notes: true
