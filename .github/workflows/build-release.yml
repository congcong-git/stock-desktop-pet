name: build-check

# 职责：push main 时做一次构建校验，产物作为 artifact 供自测下载。
# 正式发版（Windows + macOS 双平台）由 release.yml 在打 tag 时负责，此处不发布。

on:
  push:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build renderer
        run: npm run build:renderer

      # 必须显式 --publish never：CI 环境下 electron-builder 检测到存在 draft release
      # 会尝试发布，缺少 GH_TOKEN 会直接让构建失败
      - name: Package (build only)
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: niulai-setup-${{ github.run_number }}
          path: release/*.exe
          if-no-files-found: warn
