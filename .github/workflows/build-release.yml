name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "doc/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      publish:
        description: 是否发布到 GitHub Release（默认仅构建）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build renderer
        run: npm run build:renderer

      # 日常提交：只构建，不发布，产物作为 Actions artifact 供自测下载
      # 注意：必须显式 --publish never，否则 CI 环境下 electron-builder 会因存在
      # draft release 尝试发布，缺少 GH_TOKEN 直接构建失败
      - name: Package (build only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.publish != true }}
        run: npx electron-builder --win nsis --publish never

      # 发版：push tag v* 或手动勾选 publish，发布到 GitHub Release（含 latest.yml）
      - name: Package & publish Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.publish != true }}
        uses: actions/upload-artifact@v4
        with:
          name: niulai-setup-${{ github.run_number }}
          path: release/*.exe
          if-no-files-found: warn
