name: build-release

on:
  push:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build renderer
        run: npm run build:renderer

      - name: Package & publish (NSIS)
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
